name: Warm Cache After Deploy

on:
  push:
    branches:
      - main

jobs:
  warm:
    name: Warm Vercel cache
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 120

      - name: Trigger cache warm-up
        run: |
          echo "Calling warm-cache endpoint..."
          # 280s, just inside the route's own 300s maxDuration. The tasks run
          # concurrently so wall time is the slowest one, and the department
          # lenses each take the better part of a minute against the FDIC API.
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 280 \
            "https://market-intelligence-tool-gilt.vercel.app/api/cron/warm-cache")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Warm-up failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "$BODY" | grep -q '"all_ok"' && echo "All caches warm ✓" || echo "Some caches failed — check response above"

      - name: Pre-generate article briefs
        run: |
          echo "Calling warm-briefs endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            "https://market-intelligence-tool-gilt.vercel.app/api/cron/warm-briefs")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Brief warm-up failed with status $HTTP_STATUS (non-fatal)"
          fi
